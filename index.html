
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARDAM — Админ-панель</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap');

:root {
  --black: #171714;
  --dark: #22211d;
  --ivory: #f5f1e8;
  --white: #fffdf8;
  --gold: #b69a68;
  --gold-light: #d2bd94;
  --muted: #898274;
  --line: #ded7c9;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--black);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
}

header {
  min-height: 82px;
  padding: 20px 6%;
  background: var(--black);
  color: var(--ivory);
  border-bottom: 1px solid #39362f;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  letter-spacing: 9px;
  color: var(--gold-light);
}

header #account {
  color: #d7cbb5;
  font-size: 12px;
}

main {
  max-width: 1180px;
  margin: 45px auto;
  padding: 0 25px 60px;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: 29px;
  font-weight: 400;
  color: var(--black);
  margin: 20px 0 25px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px 0;
  margin: 20px 0 30px;
  border-bottom: 1px solid var(--line);
}

button {
  padding: 13px 22px;
  background: var(--black);
  color: var(--ivory);
  border: 1px solid var(--black);
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .2s ease;
}

button:hover {
  background: var(--gold);
  border-color: var(--gold);
  color: #171714;
}

button.secondary {
  background: transparent;
  color: var(--black);
  border-color: var(--line);
}

button.secondary:hover {
  background: var(--gold);
  border-color: var(--gold);
}

button.danger {
  background: transparent;
  color: #934c40;
  border-color: #c9a49c;
}

button.danger:hover {
  background: #934c40;
  color: white;
}

.card {
  background: var(--white);
  border: 1px solid var(--line);
  padding: 30px;
  margin: 18px 0;
  border-radius: 3px;
  box-shadow: 0 5px 20px rgba(30, 25, 15, .035);
}

input:not([type="checkbox"]),
textarea,
select {
  width: 100%;
  padding: 14px;
  margin: 8px 0 20px;
  background: #fffefa;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--black);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--gold);
}

label {
  color: #655e52;
  font-size: 12px;
  letter-spacing: .5px;
}

input[type="checkbox"] {
  accent-color: var(--gold);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
}

.item {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.item img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  background: #eee9df;
  border: 1px solid var(--line);
}

.item strong {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 500;
}

.small {
  font-size: 12px;
  color: var(--muted);
  margin-top: 7px;
}

#message,
#messagePanel {
  color: #887047;
  padding-top: 12px;
  font-size: 13px;
}

pre {
  background: var(--ivory);
  padding: 15px;
  overflow-x: auto;
  font-size: 12px;
  color: var(--dark);
  border: 1px solid var(--line);
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  header {
    padding: 18px 20px;
  }

  .logo {
    font-size: 25px;
    letter-spacing: 6px;
  }

  main {
    margin: 25px auto;
    padding: 0 15px 40px;
  }

  h2 {
    font-size: 25px;
  }

  .card {
    padding: 20px;
  }

  .item {
    flex-wrap: wrap;
  }

  nav button {
    flex: 1 1 40%;
  }
}

</style>
</head>
<body>
<header>
 <div class="logo">KARDAM</div>
 <div id="account"></div>
</header>

<main>
<section id="login" class="card">
 <h2>Вход администратора</h2>
 <label>Email</label>
 <input id="email" type="email" placeholder="Ваш email">
 <label>Пароль</label>
 <input id="password" type="password" placeholder="Пароль">
 <button onclick="login()">Войти</button>
 <div id="message"></div>
</section>

<section id="panel" class="hidden">
 <h2>Панель управления</h2>
 <nav>
  <button onclick="showTab('products')">Товары</button>
  <button onclick="showTab('add')">Добавить товар</button>
  <button onclick="showTab('orders')">Заказы</button>
  <button class="secondary" onclick="logout()">Выйти</button>
 </nav>

 <section id="products">
  <h2>Каталог товаров</h2>
  <div id="productList">Загрузка...</div>
 </section>

 <section id="add" class="hidden">
  <h2 id="formTitle">Новый товар</h2>
  <input type="hidden" id="productId">
  <label>Название</label>
  <input id="name" placeholder="Например, ошейник KARDAM">
  <label>Категория</label>
  <select id="category">
   <option value="Ошейники">Ошейники</option>
   <option value="Поводки">Поводки</option>
   <option value="Намордники">Намордники</option>
  </select>
  <label>Описание</label>
  <textarea id="description" rows="3" placeholder="Описание товара"></textarea>
  <div class="grid">
   <div><label>Цена (₸)</label><input id="price" type="number"></div>
   <div><label>Цена со скидкой (₸)</label><input id="sale_price" type="number"></div>
   <div><label>Количество</label><input id="stock" type="number"></div>
  </div>
  <label>Фотографии товара</label>
  <input id="photos" type="file" accept="image/*" multiple>
  <label><input id="active" type="checkbox" checked style="width:auto"> Показывать товар на сайте</label>
  <div id="photoInfo" class="small"></div>
  <button onclick="saveProduct()">Сохранить товар</button>
  <button class="secondary" onclick="resetForm()">Очистить</button>
 </section>

 <section id="orders" class="hidden">
  <h2>Заказы покупателей</h2>
  <div id="orderList">Загрузка...</div>
 </section>
 <div id="messagePanel"></div>
</section>
</main>

<script>
const SUPABASE_URL = "https://scnztnrtzepxpmdoaylx.supabase.co";
const SUPABASE_KEY = "sb_publishable_idJDzvzuO_qh1_qluunuWw_C1jghg3O";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentImages = [];

function msg(t){
 document.getElementById("messagePanel").textContent=t;
}
async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){document.getElementById("message").textContent=error.message;return;}
 await checkAdmin(data.user);
}
async function checkAdmin(user){
 const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(error || !data){
  await db.auth.signOut();
  document.getElementById("message").textContent="У этого аккаунта нет прав администратора.";
  return;
 }
 document.getElementById("login").classList.add("hidden");
 document.getElementById("panel").classList.remove("hidden");
 document.getElementById("account").textContent=user.email;
 loadProducts();
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}
function showTab(id){
 ["products","add","orders"].forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 if(id==="products")loadProducts();
 if(id==="orders")loadOrders();
}
async function loadProducts(){
 const box=document.getElementById("productList");
 box.textContent="Загрузка...";
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){box.textContent="Ошибка: "+error.message;return;}
 box.innerHTML="";
 if(!data.length){box.textContent="Товаров пока нет.";return;}
 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="item";
  const img=document.createElement("img");
  img.src=p.images?.[0]||"";
  const info=document.createElement("div");
  info.style.flex="1";
  const title=document.createElement("strong");
  title.textContent=p.name||"Без названия";
  const details=document.createElement("div");
  details.className="small";
  details.textContent=(p.category||"")+" · "+Number(p.price||0).toLocaleString("ru-RU")+" ₸ · Остаток: "+(p.stock??0);
  info.append(title,details);
  const edit=document.createElement("button");
  edit.textContent="Изменить";
  edit.onclick=()=>editProduct(p);
  const del=document.createElement("button");
  del.textContent="Удалить";
  del.className="danger";
  del.onclick=()=>deleteProduct(p.id);
  div.append(img,info,edit,del);
  box.append(div);
 });
}
function editProduct(p){
 document.getElementById("productId").value=p.id;
 document.getElementById("name").value=p.name||"";
 document.getElementById("category").value=p.category||"Ошейники";
 document.getElementById("description").value=p.description||"";
 document.getElementById("price").value=p.price||"";
 document.getElementById("sale_price").value=p.sale_price||"";
 document.getElementById("stock").value=p.stock||0;
 document.getElementById("active").checked=p.is_active!==false;
 currentImages=p.images||[];
 document.getElementById("photoInfo").textContent="Сохранённые фотографии: "+currentImages.length;
 document.getElementById("formTitle").textContent="Редактирование товара";
 showTab("add");
}
function resetForm(){
 ["productId","name","description","price","sale_price","stock"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("photos").value="";
 document.getElementById("active").checked=true;
 currentImages=[];
 document.getElementById("photoInfo").textContent="";
 document.getElementById("formTitle").textContent="Новый товар";
}
async function saveProduct(){
 const name=document.getElementById("name").value.trim();
 if(!name){msg("Введите название товара.");return;}
 const button=document.querySelector("#add button");
 button.disabled=true;
 try{
  const files=[...document.getElementById("photos").files];
  for(const file of files){
   const safeName=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const {error}=await db.storage.from("product-images").upload(safeName,file);
   if(error)throw error;
   const {data}=db.storage.from("product-images").getPublicUrl(safeName);
   currentImages.push(data.publicUrl);
  }
  const product={
   name,
   category:document.getElementById("category").value,
   description:document.getElementById("description").value,
   price:Number(document.getElementById("price").value||0),
   sale_price:Number(document.getElementById("sale_price").value||0),
   stock:Number(document.getElementById("stock").value||0),
   images:currentImages,
   is_active:document.getElementById("active").checked
  };
  const id=document.getElementById("productId").value;
  const result=id
   ? await db.from("products").update(product).eq("id",id)
   : await db.from("products").insert(product);
  if(result.error)throw result.error;
  msg("Товар сохранён.");
  resetForm();
  showTab("products");
 }catch(e){msg("Ошибка: "+e.message);}
 finally{button.disabled=false;}
}
async function deleteProduct(id){
 if(!confirm("Удалить этот товар?"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){msg("Ошибка: "+error.message);return;}
 loadProducts();
}
async function loadOrders(){
 const box=document.getElementById("orderList");
 box.textContent="Загрузка...";
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(error){box.textContent="Ошибка: "+error.message;return;}
 box.innerHTML="";
 if(!data.length){box.textContent="Заказов пока нет.";return;}
 data.forEach(o=>{
  const card=document.createElement("div");
  card.className="card";
  const heading=document.createElement("strong");
  heading.textContent="Заказ · "+(o.created_at?new Date(o.created_at).toLocaleString("ru-RU"):"");
  const phone=document.createElement("p");
  phone.textContent="Телефон: "+(o.customer_phone||"не указан");
  const address=document.createElement("p");
  address.textContent="Адрес: "+(o.delivery_address||"не указан");
  const total=document.createElement("p");
  total.textContent="Сумма: "+Number(o.total||0).toLocaleString("ru-RU")+" ₸";
  const status=document.createElement("p");
  status.textContent="Статус: "+(o.status||"Новый");
  card.append(heading,phone,address,total,status);
  if(o.items){
   const items=document.createElement("pre");
   items.style.whiteSpace="pre-wrap";
   items.textContent="Состав: "+JSON.stringify(o.items,null,2);
   card.append(items);
  }
  box.append(card);
 });
}
(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session)await checkAdmin(data.session.user);
})();
</script>
</body>
</html>
